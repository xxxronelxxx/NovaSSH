[package]
name = "nova-desktop"
version = "0.6.0"
edition = "2021"
rust-version = "1.90"
description = "NovaSSH desktop (Tauri 2 + Svelte)"
license = "MIT"

# The Flutter app lives in app/; keep this crate out of the root workspace so
# `cargo test -p nova_core` does not build the whole desktop stack.
[workspace]

[lib]
name = "nova_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nova_core = { path = "../../rust/core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target."cfg(windows)".dependencies]
window-vibrancy = "0.6"

# The app links the whole Rust core, AWS SDK and WebView assets into one exe.
# Keep the release build small: size-first optimisation, thin LTO, no symbols.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
