[package]
name = "nova_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NovaSSH core: filesystem providers, SFTP, archives, storage, crypto"

[lib]
name = "nova_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
async-trait = "0.1.92"
base64 = "0.23.1"
dirs = "7.0.0"
rand = "0.9.5"
regex = "1.13.1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
justssh-keys = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = "1.8.2"
zip = { version = "9.1.3", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma", "aes-crypto"] }
flate2 = "1.1.10"
filetime = "0.2.26"
tar = "0.4.46"
bzip2 = "0.6.1"
liblzma = "0.4.8"
zstd = "0.13.3"
sevenz-rust2 = { version = "0.13", default-features = false, features = ["compress", "aes256"] }
suppaftp = { version = "12.2.1", features = ["rustls-ring", "deprecated"] }
rustls-native-certs = "0.8.5"
similar = "2.7"
ring = "0.17"
md-5 = "0.10"
tiny_http = "0.12"
aws-sdk-s3 = "1.122.0"
aws-config = "1.8.13"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
